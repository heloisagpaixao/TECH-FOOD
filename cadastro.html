<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechFood - Sabor & Saber</title>
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/cadastro.css" />
  </head>
  <body>
    <header id="topo-loja">
      <h1 id="titulo-site">TechFood - Sabor & Saber</h1>
      <p id="boas-vindas">Carregando...</p>

      <input type="checkbox" id="bt_menu" />
      <label for="bt_menu" id="label-menu" aria-label="Abrir menu"
        >&#9776;</label
      >

      <nav id="menu">
        <ul>
          <li><a href="#grid-cardapio">Cardápio</a></li>
          <li><a href="pedidos.html">Meus Pedidos</a></li>
          <li><a href="cadastro.html">Cadastrar Prato</a></li>
        </ul>
      </nav>
    </header>

    <main id="pagina-cadastro">
      <h2 class="titulo-secao">Cadastrar Novo Prato</h2>

      <!-- Prévia da imagem -->
      <div id="previa-wrapper">
        <div id="previa-imagem">
          <span id="previa-placeholder">📷<br />Prévia da imagem</span>
          <img id="previa-img" src="" alt="Prévia" />
        </div>
      </div>

      <!-- Formulário -->
      <div id="form-cadastro-wrapper">
        <form id="form-cadastro" novalidate>
          <!-- Nome do prato -->
          <div class="campo-grupo">
            <label for="prato-nome"
              >Nome do prato <span class="obrigatorio">*</span></label
            >
            <input
              type="text"
              id="prato-nome"
              placeholder="Ex.: X-Burguer Especial"
              maxlength="60"
              autocomplete="off"
            />
            <span class="msg-erro" id="erro-nome"></span>
          </div>

          <!-- Descrição -->
          <div class="campo-grupo">
            <label for="prato-descricao"
              >Descrição <span class="obrigatorio">*</span></label
            >
            <textarea
              id="prato-descricao"
              rows="3"
              placeholder="Ingredientes, diferenciais, observações..."
              maxlength="200"
            ></textarea>
            <span class="contador-chars" id="contador-desc">0 / 200</span>
            <span class="msg-erro" id="erro-descricao"></span>
          </div>

          <!-- Preço -->
          <div class="campo-grupo">
            <label for="prato-preco"
              >Preço (R$) <span class="obrigatorio">*</span></label
            >
            <input
              type="text"
              id="prato-preco"
              placeholder="0,00"
              inputmode="decimal"
              maxlength="10"
              autocomplete="off"
            />
            <span class="msg-erro" id="erro-preco"></span>
          </div>

          <!-- Categoria -->
          <div class="campo-grupo">
            <label for="prato-categoria"
              >Categoria <span class="obrigatorio">*</span></label
            >
            <select id="prato-categoria">
              <option value="">— Selecione —</option>
              <option value="lanches">Lanches</option>
              <option value="pizzas">Pizzas</option>
              <option value="massas">Massas</option>
              <option value="saladas">Saladas</option>
              <option value="sobremesas">Sobremesas</option>
              <option value="bebidas">Bebidas</option>
            </select>
            <span class="msg-erro" id="erro-categoria"></span>
          </div>

          <!-- Imagem (URL) -->
          <div class="campo-grupo">
            <label for="prato-imagem">URL da imagem</label>
            <input
              type="url"
              id="prato-imagem"
              placeholder="https://..."
              autocomplete="off"
            />
            <span class="msg-erro" id="erro-imagem"></span>
          </div>

          <!-- Botões -->
          <div class="form-acoes">
            <button type="button" id="btn-limpar" class="btn-secundario">
              Limpar
            </button>
            <button type="submit" id="btn-salvar" class="btn-primario">
              💾 Salvar Prato
            </button>
          </div>
        </form>
      </div>

      <!-- Toast de feedback -->
      <div id="toast" role="alert" aria-live="polite"></div>

      <!-- Lista de pratos cadastrados -->
      <section id="secao-pratos-cadastrados">
        <h2 class="titulo-secao">Pratos Cadastrados</h2>
        <div id="lista-pratos-cadastrados">
          <p id="msg-lista-vazia">Nenhum prato cadastrado ainda.</p>
        </div>
      </section>
    </main>

    <footer id="rodape">
      <div class="info-footer">
        <p><strong>TechFood 2026</strong></p>
        <p>Escola SENAI Ítalo Bologna - Itu/SP</p>
        <p>Av. das Nações, 1500</p>
      </div>
      <p id="data-hora-footer"></p>
    </footer>

    <!--
      api.js antes do pedidos.js — pedidos.js chama
      buscarPedidos() e atualizarStatusPedido() do api.js.
    -->
    <script src="src/scripts/global.js"></script>
    <script src="src/scripts/api.js"></script>
    <script src="src/scripts/pedidos.js"></script>
  </body>
</html>

  </body>
</html>
